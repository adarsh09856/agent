# ============================================================
# AI Voice Engine — Docker Compose
# Includes: FreeSWITCH, Redis (cache), and monitoring
# The main AgentLabs app runs separately
# ============================================================
services:
  # ── FreeSWITCH with mod_audio_fork ────────────────────
  freeswitch:
    build:
      context: .
      dockerfile: Dockerfile.freeswitch
    image: ve-freeswitch:latest
    container_name: ve-freeswitch
    restart: unless-stopped
    ports:
      - "${FREESWITCH_SIP_PORT:-5060}:5060/udp"
      - "${FREESWITCH_SIP_PORT:-5060}:5060/tcp"
      - "${FREESWITCH_SIP_TLS_PORT:-5061}:5061/tcp"
      - "${FREESWITCH_ESL_PORT:-8021}:8021/tcp"      # ESL
      - "${FREESWITCH_WS_PORT:-8089}:8089/tcp"      # mod_audio_fork WebSocket
    volumes:
      - freeswitch-data:/usr/local/freeswitch/db
      - freeswitch-recordings:/usr/local/freeswitch/recordings
      - ./freeswitch-configs:/usr/local/freeswitch/conf:ro
    environment:
      - ESL_PASSWORD=${FREESWITCH_ESL_PASSWORD:-ClueCon}
    networks:
      - voice-engine
    healthcheck:
      test: ["CMD", "fs_cli", "-x", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ── Redis for LLM Cache & Session State ───────────────
  redis:
    image: redis:7-alpine
    container_name: ve-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"     # Dynamic port to avoid conflicts
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - voice-engine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Prometheus (optional monitoring) ──────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ve-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - voice-engine
    profiles:
      - monitoring

  # ── Grafana (optional dashboards) ─────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ve-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - voice-engine
    profiles:
      - monitoring

volumes:
  freeswitch-data:
  freeswitch-recordings:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  voice-engine:
    driver: bridge
